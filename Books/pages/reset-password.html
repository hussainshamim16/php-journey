<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container reset-password mx-auto my-3">
        <div class="reset-form w-50 mx-auto">
            <h1>Reset Password</h1>
            <form class="w-100 mt-3">
                <div class="mb-3">
                    <label for="signup-email" class="form-label">Email</label>
                    <input name="signup-email" type="email" class="form-control" id="signup-email"
                        placeholder="eg. hussainshamimdev@gmail.com">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>
                <button type="submit" class="btn custom-btn mt-3">Reset Password</button>
            </form>
        </div>
    </div>
</body>

</html>
