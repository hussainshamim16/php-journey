<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!-- bootstrap css -->
    <link rel="stylesheet" href="../bootstrap.css">
    <!-- remix icons -->
    <link rel="stylesheet" href="../remix.css">
    <!-- custom style file -->
    <link rel="stylesheet" href="../style.css">
    <!-- responsive css -->
    <link rel="stylesheet" href="../responsive.css">
</head>

<body>
    
    
    
    
    <div class="container h-auto user-profile  my-5 mx-auto row justify-content-center">
      <div class="user-profile-details bg-light w-50 h-100 rounded-1 row flex-column align-items-center py-4">
          <div class="userimage w-25  my-3">
              <img src="../images/Muhammad Hussain Shamim.png" alt="user-image" class="img-fluid rounded-pill">
             <a href="#" class="edit-profile-btn text-decoration-none position-relative">
               <span class="bg-warning border-dark rounded-pill p-1 ">
                  🖌
              </span>
             </a>
          </div>
          <div class="form-edit-profile">
              <form class="w-100">
                  <div class="mb-3">
                      <label for="userName" class="form-label">Full Name</label>
                      <input name="userName" type="text" class="form-control" id="userName"
                          placeholder="Muhammad Hussain Shamim">
                  </div>
                  <div class="mb-3">
                      <label for="userEmail" class="form-label">Email</label>
                      <input name="userEmail" type="number" class="form-control" id="userEmail"
                          placeholder="hussainshamimdev@gmail.com">
                  </div>
                  <div class="mb-3">
                      <label for="userAge" class="form-label">Age</label>
                      <input name="userAge" type="number" class="form-control" id="userAge" placeholder="18 years">
                  </div>
                  <div class="mb-3">
                      <label for="userClass" class="form-label">Class</label>
                      <input name="userClass" type="number" class="form-control" id="userClass"
                          placeholder="12 Class">
                  </div>
    
                  <button type="submit" class="btn custom-btn mt-3">Update Profile</button>
              </form>
          </div>
      </div>
    </div>
    
    <!-- bootstrap javascript-->
    <script src="../bootstrap.js"></script>
    <!-- custom javascript -->
    <script src="../script.js"></script>
</body>

</html>
