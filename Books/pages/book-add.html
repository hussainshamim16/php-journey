<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap css -->
    <link rel="stylesheet" href="../bootstrap.css">
    <!-- remix icons -->
    <link rel="stylesheet" href="../remix.css">
    <!-- custom style file -->
    <link rel="stylesheet" href="../style.css">
    <!-- responsive css -->
    <link rel="stylesheet" href="../responsive.css">
</head>

<body>


    <div class="container pb-5 book-istings d-flex justify-content-center flex-column align-items-center">
        <h1 class="text-center form-heading">Book Details</h1>
        <form class="w-50">
            <div class="mb-3">
                <label for="bookTitle" class="form-label">Book Title</label>
                <input name="book-title" type="text" class="form-control" id="bookTitle"
                    placeholder="The Smart Way To Learn Javascript">
                <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
            </div>
            <div class="mb-3">
                <label for="book-author-name" class="form-label">Author Name</label>
                <input name="book-author-name" type="text" class="form-control" id="book-author-name"
                    placeholder="Mark Myers">
            </div>
            <div class="mb-3">
                <label for="book-subject" class="form-label">Subject</label>
                <input type="text" class="form-control" name="book-subject" id="book-subject"
                    placeholder="Computer Scienc">
            </div>
            <div class="mb-3">
                <label for="book-class" class="form-label">Class</label>
                <input type="number" class="form-control" name="book-class" id="book-class" placeholder="12">
            </div>
            <div class="mb-3">
                <label for="book-price" class="form-label">Price</label>
                <input type="number" class="form-control" name="book-price" id="book-price" placeholder="800">
            </div>
            <!-- <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div> -->
            <button type="submit" class="btn custom-btn mt-3">Submit</button>
        </form>
    </div>


    <!-- bootstrap javascript-->
    <script src="../bootstrap.js"></script>
    <!-- custom javascript -->
    <script src="../script.js"></script>
</body>

</html>
