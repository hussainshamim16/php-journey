<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap css -->
    <link rel="stylesheet" href="../bootstrap.css">
    <!-- remix icons -->
    <link rel="stylesheet" href="../remix.css">
    <!-- custom style file -->
    <link rel="stylesheet" href="../style.css">
    <!-- responsive css -->
    <link rel="stylesheet" href="../responsive.css">
</head>

<body>

     <div class="container sign-up mx-auto my-5">
        <div class="signup-form w-50 mx-auto">
            <h1>Sign up</h1>
            <form class="w-100 mt-3">
                <div class="mb-3">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input name="signup-name" type="text" class="form-control" id="signup-name"
                        placeholder="eg. Muhammad Hussain">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>  
                <div class="mb-3">
                    <label for="signup-email" class="form-label">Email</label>
                    <input name="signup-email" type="email" class="form-control" id="signup-email"
                        placeholder="eg. hussainshamimdev@gmail.com">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>  
                <div class="mb-3">
                    <label for="signup-user-age" class="form-label">Age</label>
                    <input name="signup-user-age" type="number" class="form-control" id="signup-user-age"
                        placeholder="eg. 18">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>  
                <div class="mb-3">
                    <label for="signup-user-class" class="form-label">Education</label>
                    <input name="signup-user-class" type="number" class="form-control" id="signup-user-class"
                        placeholder="eg. 12">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>  
                <div class="mb-3">
                    <label for="signup-user-password" class="form-label">Password</label>
                    <input name="signup-user-password" type="password" class="form-control" id="signup-user-password"
                        placeholder="eg. ***********">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>  
                <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Remember Me</label>
            </div>
                <button type="submit" class="btn custom-btn mt-3">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- bootstrap javascript-->
    <script src="../bootstrap.js"></script>
    <!-- custom javascript -->
    <script src="../script.js"></script>
</body>

</html>
